<po-page-default p-title="Kanban — Tarefas da Equipe">

  <!-- Componente reutilizável de kanban -->
  <app-kanban-board
    [pColumns]="columns"
    [(pTarefas)]="tasks"
    [pEditable]="true"
    (pMover)="onMover($event)"
    (pExcluir)="onExcluir($event)"
    (pDetalhes)="onDetalhes($event)">
  </app-kanban-board>

</po-page-default>
