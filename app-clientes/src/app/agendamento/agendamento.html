<po-page-default p-title="Agendamento">

  <!-- Componente reutilizável de agendamento (semanal/mensal) -->
  <app-agenda-viewer
    [(pAgendamentos)]="agendamentos"
    [pTipoOptions]="tipoOptions"
    (pAbrir)="onAbrir($event)"
    (pSalvar)="onSalvar($event)"
    (pExcluir)="onExcluir($event)"
    (pMover)="onMover($event)"
    (pRedimensionar)="onRedimensionar($event)">
  </app-agenda-viewer>

</po-page-default>
